name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci, never npm install — reproducible, and it fails loudly if the
      # lockfile and manifests have drifted. docs/DEPLOYMENT.md §4.
      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit checks
        run: node --experimental-strip-types shared/src/money.test.ts

      # PGlite needs no service container — it is Postgres in-process.
      - name: Database migrate, seed and constraint checks
        run: |
          npm run db:migrate -w backend
          npm run db:seed -w backend
          npm run db:test -w backend

      - name: Pricing, signatures and state machine
        run: |
          npm run test:pricing -w backend
          npm run test:payments -w backend
          npm run test:status -w backend
          npm run test:auth -w backend

      # Guards the invariant that matters most. Against PGlite this proves the
      # arithmetic, not contention — see the header in concurrency.test.ts.
      - name: Stock guard and no-oversell
        run: |
          npm run test:stock -w backend
          npm run test:concurrency -w backend
          npm run test:reconcile -w backend

      - name: Queue and fulfilment
        run: |
          npm run test:queue -w backend
          npm run test:fulfilment -w backend

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: node scripts/check-bundle-size.mjs

      - name: Dependency audit
        run: npm audit --audit-level=high
